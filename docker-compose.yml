version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: programjudge
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Flask后端
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/programjudge
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: your-super-secret-jwt-key-here
      ENCRYPTION_KEY: your-encryption-key-here
      JUDGE_WORKERS: 2
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "flask db upgrade &&
             python -m app.judge.runner &
             gunicorn --bind 0.0.0.0:5000 --workers 4 'app:create_app()'"

  # 评测沙箱
  judge-sandbox:
    build: ./judge_sandbox
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      - backend

  # Vue前端
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      VUE_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
